[project]
name = "bolo-backend"
version = "0.1.0"
description = "Bolo: Hinglish voice receptionist API for clinics (FastAPI + LangGraph + Postgres)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Line length is left to `ruff format`; the remaining long lines are string literals (prompts, test data).
ignore = ["E501"]
